<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #24292f;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    .wrapper {
      max-width: 680px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e1e4e8;
    }
    .header {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: #ffffff;
      padding: 32px 28px;
      text-align: left;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .meta-tag {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .content {
      padding: 28px;
    }
    .content h2 {
      font-size: 18px;
      color: #1f2937;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 8px;
      margin-top: 28px;
      margin-bottom: 16px;
    }
    .content h3 {
      font-size: 16px;
      color: #374151;
      margin-top: 20px;
      margin-bottom: 8px;
    }
    .content p {
      margin: 10px 0;
      font-size: 15px;
      color: #4b5563;
    }
    .content ul, .content ol {
      padding-left: 20px;
      margin: 12px 0;
    }
    .content li {
      margin-bottom: 10px;
      font-size: 15px;
      color: #374151;
    }
    .content a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .content a:hover {
      text-decoration: underline;
    }
    .footer {
      background-color: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: 20px 28px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }
    .footer a {
      color: #4b5563;
      text-decoration: underline;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0d1117; color: #c9d1d9; }
      .wrapper { background: #161b22; border-color: #30363d; }
      .content h2 { color: #f0f6fc; border-color: #30363d; }
      .content h3 { color: #e6edf3; }
      .content p, .content li { color: #8b949e; }
      .content a { color: #58a6ff; }
      .footer { background-color: #0d1117; border-color: #30363d; color: #8b949e; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>🚀 {{ title }}</h1>
      <p>为您精选整理的全球 AI 行业高价值动态 · 每日定时投递</p>
      <div class="meta-tag">📅 {{ date }} · ⚡ {{ article_count }} 篇精选源素材</div>
    </div>
    <div class="content">
      {{ body_html | safe }}
    </div>
    <div class="footer">
      <p>本邮件由自动化系统通过 GitHub Actions 与大模型智能生成 · 保持好奇心与生产力</p>
    </div>
  </div>
</body>
</html>
