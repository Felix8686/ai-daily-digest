# AI Daily Digest 订阅源配置文件（全景实操·闭环系统版）

settings:
  time_window_hours: 36
  max_items_per_feed: 5
  language: "zh-CN"
  llm_provider: "openai_compatible"
  gemini_model: "gemini-2.5-flash"
  site_password: "felix8686"
  cname: "news.felix8686.top"
  # GitHub 新项目最大天数限制（超过此天数的老项目二次翻红不作为新工具）
  github_max_repo_age_days: 90

filters:
  # 读者已知、已安装或日常使用的工具与技能（一律不作为新工具推荐）
  known_tools:
    - "agent-reach"
    - "Panniantong/Agent-Reach"
    - "opencli"
    - "openviking"
    - "hermes"
    - "obsidian"
    - "book-to-kindle"
    - "ai-radar"
    - "article-adapter"
    - "video-library-sorter"
    - "wechat-viral-evaluator"
    - "baoyu-article-illustrator"
    - "baoyu-cover-image"
    - "baoyu-format-markdown"

feeds:
  # 1. 行业异动、降价、重磅模型与平台风控
  - name: "量子位 (国内生态与大模型动态)"
    category: "大模型动态与降价"
    url: "https://www.qbitai.com/feed"

  - name: "OpenAI News (官方动态与接口变更)"
    category: "大厂官方动态"
    url: "https://openai.com/news/rss.xml"

  - name: "Google AI / DeepMind"
    category: "大厂官方动态"
    url: "https://blog.google/technology/ai/rss/"

  # 2. 上手神器、独立开发与本地平替（含 GitHub 第一阵地）
  - name: "Product Hunt AI"
    category: "上手神器与新产品"
    url: "https://www.producthunt.com/feed"

  - name: "Show HN (独立开发者项目)"
    category: "独立开发与新工具"
    url: "https://hnrss.org/show"

  - name: "GitHub Trending (全语言开源热榜)"
    category: "开源热榜与新工具"
    url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"

  - name: "GitHub Trending (Python/AI热榜)"
    category: "开源热榜与新工具"
    url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/python.xml"

  - name: "Simon Willison (实用Agent与本地生态)"
    category: "本地平替与实操"
    url: "https://simonwillison.net/atom/everything/"

  # 3. X(推特)一手爆款、前沿实操与选题（含 X 第一阵地）
  - name: "AlphaSignal (X前沿爆款与新模型)"
    category: "X前沿趋势与爆款"
    url: "https://alphasignal.ai/feed.xml"

  - name: "Ben's Bites (X热门AI实操与新玩法)"
    category: "X热门实操与新玩法"
    url: "https://www.bensbites.com/feed"

  - name: "宝玉的分享 (Prompt与深度思考)"
    category: "创作者实操与选题"
    url: "https://baoyu.io/feed.xml"

  - name: "少数派 (个人数字生活与AI提效)"
    category: "个人生产力与工作流"
    url: "https://sspai.com/feed"
